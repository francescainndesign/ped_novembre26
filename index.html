<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grotta Marcello — approvazioni ottobre</title>
<!--
  COME SI USA (per Fra)

  1. Metti questo file in una cartella insieme a una sottocartella "media/"
     con dentro le foto e i video dei post (i nomi devono corrispondere a
     quelli nel blocco POSTS qui sotto). Funziona aperto in locale o
     caricato su GitHub Pages come le altre tue app.
  2. Ogni post si può Approvare, segnare Da modificare (con commento) o
     Rifiutare. Chi apre il file sceglie il proprio nome la prima volta.
  3. Le decisioni restano salvate sul dispositivo di chi le prende.
     Il pulsante "Invia riepilogo" in fondo prepara un messaggio WhatsApp
     con tutte le decisioni, da mandare a te.
  4. Se vuoi che le decisioni si sincronizzino da sole (tu le vedi senza
     aspettare il riepilogo), compila SUPABASE_URL e SUPABASE_KEY e crea
     nel tuo progetto Supabase questa tabella:

       create table approvazioni (
         post_id text not null,
         reviewer text not null,
         decision text,
         comment text,
         updated_at timestamptz default now(),
         primary key (post_id, reviewer)
       );
       alter table approvazioni enable row level security;
       create policy "aperta" on approvazioni for all using (true) with check (true);

     Se i due campi restano vuoti, il file funziona comunque in locale.

  5. Le didascalie e i post sono in dati.js: è quello il file da modificare.
     Per i mesi successivi basta duplicare la cartella e riscrivere dati.js.
-->
<script>
const SUPABASE_URL = "";   // es. https://xxxx.supabase.co  (facoltativo)
const SUPABASE_KEY = "";   // anon key                       (facoltativo)

const REVIEWERS = ["Angelo", "Sara", "Fra"];

/* I post e le didascalie sono nel file dati.js, nella stessa cartella. */
</script>
<script src="dati.js"></script>
<style>
:root{
  --carta:#F7EFE7; --bordeaux:#85575B; --bordeaux-scuro:#6d4548;
  --rosa:#e5d3cd; --inchiostro:#3a2e2c;
  --ok:#4a7c59; --mod:#a8762a; --no:#a04545;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--carta); color:var(--inchiostro);
  font-family:Georgia,'Times New Roman',serif;
  padding-bottom:110px;
}
header{
  padding:26px 20px 18px; border-bottom:2px solid var(--bordeaux);
  display:flex; flex-direction:column; gap:4px;
}
header h1{
  font-size:26px; color:var(--bordeaux); font-weight:700; letter-spacing:.01em;
}
header p{font-size:14px; color:var(--bordeaux-scuro)}
main{max-width:560px; margin:0 auto; padding:14px 14px 0; display:flex; flex-direction:column; gap:26px}

.chi{
  max-width:560px; margin:14px auto 0; padding:0 14px;
  display:flex; align-items:center; gap:10px; font-size:14px;
}
.chi select{
  font:inherit; font-size:15px; padding:7px 10px; border:1.5px solid var(--bordeaux);
  background:#fff; color:var(--inchiostro); border-radius:6px;
}

article{
  background:#fff; border:1px solid var(--rosa); border-radius:10px; overflow:hidden;
  box-shadow:0 2px 10px rgba(133,87,91,.08);
}
.testata{
  padding:14px 16px 10px; display:flex; justify-content:space-between; align-items:baseline; gap:10px;
}
.testata b{font-size:17px; color:var(--bordeaux)}
.testata span{font-size:13px; color:var(--bordeaux-scuro); white-space:nowrap}
.formato{padding:0 16px 10px; font-size:13px; color:var(--bordeaux-scuro); font-style:italic}

.media{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; background:#111; -webkit-overflow-scrolling:touch}
.media > *{flex:0 0 100%; scroll-snap-align:center; width:100%; max-height:72vh; object-fit:contain; display:block}
.media .manca{
  background:repeating-linear-gradient(45deg,#efe6dd,#efe6dd 10px,#f7efe7 10px,#f7efe7 20px);
  color:var(--bordeaux-scuro); display:flex; align-items:center; justify-content:center;
  min-height:220px; font-size:14px; text-align:center; padding:20px;
}

.caption{padding:14px 16px; font-size:16px; line-height:1.45; white-space:pre-line; border-top:1px solid var(--rosa)}
.nota{padding:0 16px 12px; font-size:13px; color:var(--bordeaux-scuro)}

.azioni{display:flex; border-top:1px solid var(--rosa)}
.azioni button{
  flex:1; padding:14px 6px; font-family:inherit; font-size:15px; background:none; border:none;
  color:var(--inchiostro); cursor:pointer; border-right:1px solid var(--rosa);
}
.azioni button:last-child{border-right:none}
.azioni button:focus-visible{outline:2px solid var(--bordeaux); outline-offset:-3px}
article[data-dec="ok"] .b-ok{background:var(--ok); color:#fff}
article[data-dec="mod"] .b-mod{background:var(--mod); color:#fff}
article[data-dec="no"] .b-no{background:var(--no); color:#fff}

.commento{display:none; padding:12px 16px 16px; border-top:1px dashed var(--rosa)}
.commento.aperto{display:block}
.commento textarea{
  width:100%; min-height:70px; font-family:inherit; font-size:15px; padding:10px;
  border:1.5px solid var(--rosa); border-radius:6px; background:var(--carta); color:var(--inchiostro);
  resize:vertical;
}
.commento small{display:block; margin-top:6px; color:var(--bordeaux-scuro); font-size:12px}

.stato-altri{padding:8px 16px 12px; font-size:12px; color:var(--bordeaux-scuro)}

footer{
  position:fixed; left:0; right:0; bottom:0; background:var(--bordeaux); color:#fff;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
footer .conto{font-size:14px}
footer button{
  font-family:inherit; font-size:15px; padding:10px 16px; border:none; border-radius:7px;
  background:var(--carta); color:var(--bordeaux); cursor:pointer; font-weight:700;
}
@media (prefers-reduced-motion:no-preference){
  .azioni button{transition:background .15s}
}
</style>
</head>
<body>
<header>
  <h1>Grotta Marcello · ottobre</h1>
  <p>Nove post in ordine di uscita. Per ognuno: approva, chiedi una modifica o rifiuta.</p>
</header>

<div class="chi">
  <label for="reviewer">Chi sta guardando:</label>
  <select id="reviewer"></select>
</div>

<main id="lista"></main>

<footer>
  <div class="conto" id="conto"></div>
  <button id="invia">Invia riepilogo</button>
</footer>

<script>
/* Memoria locale con riserva in caso il browser la blocchi */
const mem = {};
function ricorda(k, v){ try{ localStorage.setItem(k, v); }catch(e){} mem[k]=v; }
function leggi(k){ try{ const v = localStorage.getItem(k); if(v!==null) return v; }catch(e){} return (k in mem)? mem[k] : null; }

const sel = document.getElementById('reviewer');
REVIEWERS.forEach(r => { const o=document.createElement('option'); o.value=r; o.textContent=r; sel.appendChild(o); });
sel.value = leggi('gm_reviewer') || REVIEWERS[0];
sel.addEventListener('change', () => { ricorda('gm_reviewer', sel.value); rendi(); });

const ETI = { ok:"Approvato", mod:"Da modificare", no:"Rifiutato" };

function chiave(postId){ return 'gm_'+postId+'_'+sel.value; }

function decisione(postId){
  const raw = leggi(chiave(postId));
  if(!raw) return { dec:null, com:"" };
  try{ return JSON.parse(raw); }catch(e){ return { dec:null, com:"" }; }
}

function salva(postId, dec, com){
  ricorda(chiave(postId), JSON.stringify({ dec, com }));
  sincronizza(postId, dec, com);
  aggiornaConto();
}

/* Sincronizzazione facoltativa su Supabase */
async function sincronizza(postId, dec, com){
  if(!SUPABASE_URL || !SUPABASE_KEY) return;
  try{
    await fetch(SUPABASE_URL + '/rest/v1/approvazioni', {
      method:'POST',
      headers:{
        'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates'
      },
      body: JSON.stringify({ post_id:postId, reviewer:sel.value, decision:dec, comment:com, updated_at:new Date().toISOString() })
    });
  }catch(e){ /* senza rete si continua in locale */ }
}

async function caricaAltri(){
  if(!SUPABASE_URL || !SUPABASE_KEY) return;
  try{
    const r = await fetch(SUPABASE_URL + '/rest/v1/approvazioni?select=*', {
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY }
    });
    const righe = await r.json();
    righe.forEach(x => {
      const el = document.querySelector('[data-stato="'+x.post_id+'"]');
      if(!el) return;
      if(x.reviewer === sel.value) return;
      const eti = ETI[x.decision] || x.decision || '—';
      const com = x.comment ? ' — "'+x.comment+'"' : '';
      el.textContent += (el.textContent ? '  ·  ' : '') + x.reviewer + ': ' + eti + com;
    });
  }catch(e){}
}

function rendi(){
  const main = document.getElementById('lista');
  main.innerHTML = '';
  POSTS.forEach(p => {
    const st = decisione(p.id);
    const art = document.createElement('article');
    if(st.dec) art.dataset.dec = st.dec;

    const media = p.media.map(m => {
      if(m.type === 'video')
        return '<video controls playsinline preload="metadata" src="'+m.src+'" onerror="this.outerHTML=\'<div class=manca>Video non trovato:<br>'+m.src+'</div>\'"></video>';
      return '<img src="'+m.src+'" alt="" onerror="this.outerHTML=\'<div class=manca>Foto non trovata:<br>'+m.src+'</div>\'">';
    }).join('');

    art.innerHTML =
      '<div class="testata"><b>'+p.titolo+'</b><span>'+p.data+'</span></div>'+
      '<div class="formato">'+p.formato+'</div>'+
      '<div class="media">'+media+'</div>'+
      '<div class="caption">'+p.caption+'</div>'+
      (p.note ? '<div class="nota">'+p.note+'</div>' : '')+
      '<div class="azioni">'+
        '<button class="b-ok">Approva</button>'+
        '<button class="b-mod">Da modificare</button>'+
        '<button class="b-no">Rifiuta</button>'+
      '</div>'+
      '<div class="commento'+(st.dec==='mod'||st.com ? ' aperto':'')+'">'+
        '<textarea placeholder="Cosa cambieresti?">'+(st.com||'')+'</textarea>'+
        '<small>Il commento si salva da solo mentre scrivi.</small>'+
      '</div>'+
      '<div class="stato-altri" data-stato="'+p.id+'"></div>';

    const ta = art.querySelector('textarea');
    art.querySelector('.b-ok').onclick  = () => { art.dataset.dec='ok';  art.querySelector('.commento').classList.remove('aperto'); salva(p.id,'ok', ta.value); };
    art.querySelector('.b-mod').onclick = () => { art.dataset.dec='mod'; art.querySelector('.commento').classList.add('aperto');    salva(p.id,'mod',ta.value); ta.focus(); };
    art.querySelector('.b-no').onclick  = () => { art.dataset.dec='no';  art.querySelector('.commento').classList.add('aperto');    salva(p.id,'no', ta.value); };
    ta.addEventListener('input', () => { const cur = decisione(p.id); salva(p.id, cur.dec, ta.value); });

    main.appendChild(art);
  });
  aggiornaConto();
  caricaAltri();
}

function aggiornaConto(){
  const fatte = POSTS.filter(p => decisione(p.id).dec).length;
  document.getElementById('conto').textContent = sel.value + ' · ' + fatte + ' su ' + POSTS.length;
}

document.getElementById('invia').onclick = () => {
  let righe = ['Piano ottobre — decisioni di ' + sel.value + ':', ''];
  POSTS.forEach(p => {
    const st = decisione(p.id);
    let r = p.data.split(' ')[1] + ' ' + p.data.split(' ')[2] + ' — ' + p.titolo + ': ' + (st.dec ? ETI[st.dec] : 'non visto');
    if(st.com) r += ' ("' + st.com + '")';
    righe.push(r);
  });
  const testo = righe.join('\n');
  const url = 'https://wa.me/?text=' + encodeURIComponent(testo);
  window.open(url, '_blank');
};

rendi();
</script>
</body>
</html>
